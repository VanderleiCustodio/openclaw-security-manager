<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OpenClaw Security Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
      --accent:      #4361EE;
      --accent-h:    #3451D1;
      --accent-dim:  rgba(67,97,238,.12);
      --accent-ring: rgba(67,97,238,.30);
      --accent-sh:   0 2px 8px rgba(67,97,238,.35);
      --r2: 6px; --r3: 10px;
    }
    :root, [data-theme="light"] {
      --bg:  #F5F6FA;
      --s1:  #FFFFFF;
      --s2:  #F0F2F8;
      --b1:  #E0E4EC;
      --b2:  #CDD2DC;
      --t1:  #1B2431;
      --t2:  #4A5568;
      --t3:  #718096;
      --t4:  #A0AEC0;
      --sh1: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
      --sh2: 0 4px 16px rgba(0,0,0,.10);
      --red: #DC2626; --red-dim: rgba(220,38,38,.10);
      --icon-theme: '☀️';
    }
    [data-theme="dark"] {
      --bg:  #111827;
      --s1:  #1E2A3B;
      --s2:  #273142;
      --b1:  #2D3F56;
      --b2:  #3D5166;
      --t1:  #F0F4FF;
      --t2:  #C8D8E8;
      --t3:  #8A9BB0;
      --t4:  #5A6A7E;
      --sh1: 0 1px 3px rgba(0,0,0,.4);
      --sh2: 0 4px 16px rgba(0,0,0,.5);
      --red: #F87171; --red-dim: rgba(248,113,113,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light dark; }
    body {
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -.01em;
    }

    /* Theme toggle */
    .theme-btn {
      position: fixed;
      top: 16px; right: 16px;
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: var(--r2);
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: var(--sh1);
      transition: background .15s;
    }
    .theme-btn:hover { background: var(--s2); }

    /* Card */
    .card {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: var(--r3);
      box-shadow: var(--sh2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      margin: 16px;
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      gap: 12px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: var(--accent-dim);
      border-radius: var(--r3);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }
    .logo-icon svg { width: 24px; height: 24px; }
    .logo-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--t1);
      letter-spacing: -.02em;
    }
    .logo-sub {
      font-size: 12px;
      color: var(--t3);
      margin-top: -8px;
    }

    /* Error banner */
    .error-banner {
      background: var(--red-dim);
      border: 1px solid var(--red);
      border-radius: var(--r2);
      color: var(--red);
      font-size: 13px;
      padding: 10px 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Fields */
    .field { margin-bottom: 16px; }
    .field-label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--t3);
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--s2);
      color: var(--t1);
      border: 1px solid var(--b1);
      border-radius: var(--r2);
      height: 38px;
      padding: 0 36px 0 10px;
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }
    input::placeholder { color: var(--t4); }

    /* Show/hide password */
    .toggle-pw {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--t3); cursor: pointer;
      padding: 2px;
      display: flex; align-items: center;
    }
    .toggle-pw:hover { color: var(--t1); }
    .toggle-pw svg { width: 16px; height: 16px; }

    /* Submit button */
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r2);
      height: 38px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: var(--accent-sh);
      transition: background .15s;
      letter-spacing: -.01em;
    }
    .btn-submit:hover { background: var(--accent-h); }
    .btn-submit:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <button class="theme-btn" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema">
    <span id="theme-icon">🌙</span>
  </button>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="logo-title">OpenClaw</div>
      <div class="logo-sub">Security Manager</div>
    </div>

    {% if error %}
    <div class="error-banner">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="on">
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               placeholder="seu usuário" required autofocus>
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="••••••••" required>
          <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar senha">
            <svg id="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Entrar</button>
    </form>
  </div>

  <script>
    // Theme persistence
    const html = document.documentElement;
    const saved = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', saved);
    document.getElementById('theme-icon').textContent = saved === 'dark' ? '☀️' : '🌙';

    function toggleTheme() {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-icon').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    // Show/hide password
    function togglePw() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
